[project]
name = "henry-hub-forecast"
version = "0.1.0"
description = "Leakage-safe direct multi-horizon Henry Hub natural gas forecasting"
requires-python = ">=3.11,<3.13"
dependencies = [
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pymupdf>=1.24,<2",
  "pypdf>=5,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2,<3"]
dl = ["neuralforecast>=3.1,<4", "torch>=2.6,<3"]
dev = ["pytest>=8,<9", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
